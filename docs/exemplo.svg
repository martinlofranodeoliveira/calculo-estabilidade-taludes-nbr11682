    </text>

    <g transform="translate(944, 675)">
        <text x="0" y="15" fill="#94a3b8" font-size="13" font-family="sans-serif">Solo / Formação:</text>
        <text x="440" y="15" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end" font-family="sans-serif">Solo residual de gnaisse (argila siltosa)</text>

        <text x="0" y="42" fill="#94a3b8" font-size="13" font-family="sans-serif">Coesão Efetiva (c'):</text>
        <text x="440" y="42" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end" font-family="sans-serif">22,00 kPa</text>

        <text x="0" y="69" fill="#94a3b8" font-size="13" font-family="sans-serif">Ângulo de Atrito Interno (φ'):</text>
        <text x="440" y="69" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end" font-family="sans-serif">26°</text>

        <text x="0" y="96" fill="#94a3b8" font-size="13" font-family="sans-serif">Peso Específico Natural (γ):</text>
        <text x="440" y="96" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end" font-family="sans-serif">18 kN/m³</text>
    </g>

    <!-- Barra de Rodapé -->
