        <polygon points="168,750 168,688 316,688 465,541 504,541 652,395 810,380 810,750" fill="url(#solo-grad)" />

        <!-- Lamelas / Fatias Discretizadas -->
        <path d="M 333 658 L 359 658 L 359 680 L 333 680 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 359 632 L 385 632 L 385 690 L 359 690 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 385 606 L 412 606 L 412 697 L 385 697 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 412 580 L 438 580 L 438 701 L 412 701 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 438 555 L 464 555 L 464 702 L 438 702 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 464 541 L 490 541 L 490 700 L 464 700 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 490 541 L 516 541 L 516 694 L 490 694 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 516 516 L 542 516 L 542 686 L 516 686 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 542 491 L 568 491 L 568 674 L 542 674 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 568 465 L 594 465 L 594 658 L 568 658 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 594 439 L 620 439 L 620 638 L 594 638 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 620 413 L 646 413 L 646 613 L 620 613 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 646 394 L 673 394 L 673 583 L 646 583 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 673 392 L 699 392 L 699 545 L 673 545 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 699 389 L 725 389 L 725 496 L 699 496 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/><path d="M 725 387 L 751 387 L 751 431 L 725 431 Z" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>

        <!-- Superfície do Terreno (Linha Topográfica) -->
        <polyline points="168,688 316,688 465,541 504,541 652,395 810,380" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linejoin="round" />

        <!-- Círculo de Ruptura Geotécnico -->
        <circle cx="445" cy="219" r="326" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="8,4" />

        <!-- Centro de Rotação O(X, Y) -->
        <circle cx="445" cy="219" r="5" fill="#f43f5e" />
        <line x1="435" y1="219" x2="455" y2="219" stroke="#f43f5e" stroke-width="2" />
        <line x1="445" y1="209" x2="445" y2="229" stroke="#f43f5e" stroke-width="2" />
        <text x="457" y="224" fill="#fda4af" font-size="12" font-weight="600" font-family="sans-serif">
