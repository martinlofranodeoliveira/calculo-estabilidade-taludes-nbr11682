    </text>

    <!-- Badges Superiores de Status -->
    <rect x="1080" y="44" width="300" height="68" rx="8" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1.5" />
    <text x="1100" y="70" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1" font-family="sans-serif">
